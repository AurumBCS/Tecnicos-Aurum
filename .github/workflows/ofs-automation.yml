name: Automatizacion OFS

# Las 2 tareas (ruta del dia siguiente a las 14:00 y a las 17:30) corren
# exclusivamente en AWS Lambda + EventBridge Scheduler -- ver
# Automatizacion-Plantilla/README.md. Este workflow ya no tiene triggers
# `schedule:` (se retiraron una vez confirmado que Lambda es estable, para
# no duplicar correos/subidas); queda solo `workflow_dispatch` como
# respaldo manual para probar un script suelto sin tocar Lambda.
#
# Credenciales: SIEMPRE desde GitHub Secrets (Settings > Secrets and
# variables > Actions), nunca escritas aqui.

on:
  workflow_dispatch:
    inputs:
      tarea:
        description: 'Que tarea correr manualmente (prueba)'
        required: true
        type: choice
        options:
          - mediodia
          - tarde
        default: tarde

jobs:
  correr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Automatizacion-Plantilla
    env:
      ETADIRECT_PASS: ${{ secrets.ETADIRECT_PASS }}  # contraseña de Microsoft (cuenta de Verisure)
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Mediodia/Tarde — descargar ruta y subir a confirmaciones
        if: inputs.tarea == 'mediodia' || inputs.tarea == 'tarde'
        run: python descargar_ruta_y_subir.py

      - name: Subir capturas/descargas/log para diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ github.run_number }}
          path: |
            Automatizacion-Plantilla/descargas/
            Automatizacion-Plantilla/automatizacion.log
          retention-days: 7
          if-no-files-found: ignore
